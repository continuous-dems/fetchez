name: Test

on:
  push:
    branches: main
  pull_request:
    branches: "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "pytest (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.resolution }} dependencies)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            resolution: highest
          - os: ubuntu-latest
            python-version: "3.14"
            resolution: highest
          - os: ubuntu-latest
            python-version: "3.12"
            resolution: lowest-direct
          - os: windows-latest
            python-version: "3.12"
            resolution: highest
          - os: macos-latest
            python-version: "3.12"
            resolution: highest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        shell: bash
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          uv pip install --resolution "$RESOLUTION" -e .
          uv pip freeze --exclude-editable > "$RUNNER_TEMP/installed.txt"
          uv pip install --group test --constraint "$RUNNER_TEMP/installed.txt"
          uv pip list

      - name: Test
        run: pytest -vv -r ap --cov

      - name: Package the extension
        run: uv build
