name: audit-full
description: Hash files, enrich entries, and log to JSON.
category: metadata
tags:
  - checksum
  - provenance
  - audit-log
use_cases:
  - recording SHA-256 checksums and enriched metadata for an acquisition
hooks:
  - name: checksum
    args:
      algo: sha256
  - name: enrich
  - name: audit
    args:
      file: audit_full.json
